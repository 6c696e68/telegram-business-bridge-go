name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 300s .
      - name: arm64 build must stay under 8 MB
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -buildid=" -o /tmp/tg-bridge .
          size=$(stat -c%s /tmp/tg-bridge)
          echo "arm64 binary: $size bytes"
          test "$size" -le $((8 * 1024 * 1024))
